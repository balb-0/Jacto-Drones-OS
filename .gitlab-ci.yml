# ─────────────────────────────────────────────────────────────────────────
# Esteira CI/CD — Jacto Drones OS v0.1
#
# Arquitetura: fragmentos por concern via `include` glob (`ci/*.yml`). O root
# declara os stages; cada branch adiciona o seu ci/*.yml SEM editar este arquivo
# nem conflitar. Pipelines rodam mesmo antes de os outros fragmentos existirem.
#
# Restrições da instância (validadas por spike — ver docs/decisoes/0006):
#  - Runner compartilhado id=100 = docker-executor SEM privilégio/socket
#    (nada de docker build/run); usa imagem PÚBLICA como runtime do job.
#  - SEM Container Registry (CI_REGISTRY vazio) → artefato imutável = artefato
#    de CI por $CI_COMMIT_SHA; promoção via Environments (deploy simulado).
# ─────────────────────────────────────────────────────────────────────────
stages:
  - lint
  - build      # build PX4 SITL (ci/sitl-metrics.yml — @Calebe)
  - test       # missão + métricas + testes (ci/sitl-metrics.yml — @Calebe)
  - sast       # secrets + SAST (ci/sast.yml — @Lucca)
  - gate       # quality gates obrigatórios (ci/quality-gates.yml — @Fernando)
  - deploy     # promoção por ambiente + release (ci/deploy.yml — @Vitor)
  - notify     # notificação do resultado do pipeline (ci/notify.yml — @Kauan)

include:
  # Glob: inclui todos os fragmentos por concern que EXISTIREM em ci/ — cada
  # branch adiciona o seu ci/*.yml sem editar este arquivo nem conflitar, e
  # arquivos ainda ausentes (camadas futuras) simplesmente não entram.
  # ci/deploy.yml (@Vitor), ci/sitl-metrics.yml (@Calebe), e adiante
  # ci/quality-gates.yml (@Fernando) + ci/sast.yml (@Lucca).
  - local: 'ci/*.yml'

variables:
  GIT_SUBMODULE_STRATEGY: none
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip"

# Lint Python rápido (feedback de baixo custo). Informativo na fundação;
# endurece como gate quando o TG6 amarra a esteira.
lint:
  stage: lint
  image: python:3.12-slim
  cache:
    key: pip-lint
    paths: [.pip/]
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check libs scripts tests
  allow_failure: true
