# ─────────────────────────────────────────────────────────────────────────
# TG2 — Detecção de anomalias server-side, no stage `gate` (@Calebe)
#
# Porta as regras de anomalia do dashboard (src/src/lib/anomaly-detection.ts)
# para a esteira: o CI passa a enxergar VIBRATION SPIKE / PWM DIVERGENCE /
# ATTITUDE INSTABILITY / ACCELERATION SPIKE sem depender do front. Consome a
# telemetria de voo (reports/flight-telemetry.json, .points) produzida pelo job
# `sitl-mission-metrics` (stage test) e publica reports/anomalies.json (contrato
# {_meta, anomalies}) como artefato, com cópia versionada em src/src/data/.
#
# reports/anomalies.json alimenta o quality gate (ci/quality-gates.yml): o
# scripts/quality_gates.py reprova o merge se houver anomalia CRITICAL (TG2.3).
#
# Por que `dependencies:` (e NÃO `needs:`): o job roda no stage `gate`, DEPOIS
# de `test`, então a ordem de stage já garante que `sitl-mission-metrics` rodou
# — não há DAG-bypass (mesma regra de ci/quality-gates.yml / ADR-0006). O
# `dependencies:` aqui só RESTRINGE o download de artefatos a esse único job
# (evita baixar artefato à toa); não cria aresta de DAG que pudesse ANTECIPAR
# este job e contornar stages intermediários.
# ─────────────────────────────────────────────────────────────────────────
detect-anomalies:
  stage: gate
  image: python:3.12-slim
  # Baixa apenas o artefato reports/flight-telemetry.json do job da missão SITL;
  # a ordem de stage (test → gate) garante que ele já existe quando este inicia.
  dependencies:
    - sitl-mission-metrics
  script:
    - 'echo "### detecta anomalias (regras do dashboard) sobre reports/flight-telemetry.json"'
    # detect_anomalies.py é stdlib pura (json/argparse) → sem pip install. Lê o
    # reports/flight-telemetry.json baixado do sitl-mission-metrics e grava o
    # contrato {_meta, anomalies} em reports/anomalies.json.
    - python scripts/detect_anomalies.py
        --input reports/flight-telemetry.json
        --output reports/anomalies.json
    # Snapshot versionado que o front importa estaticamente (src/src/data/*.json),
    # mesmo padrão do 'cp reports/flight-telemetry.json src/src/data/' do
    # sitl-mission-metrics. Mantém o dashboard alinhado ao último run da esteira.
    - 'mkdir -p src/src/data && cp reports/anomalies.json src/src/data/anomalies.json'
    - 'echo "--- reports/anomalies.json (resumo) ---"'
    # Eco curto do total/severidades pro log do job (auditável sem abrir o
    # artefato). Lê a lista do contrato (.anomalies), não a raiz.
    - 'python -c "import json; d=json.load(open(''reports/anomalies.json'')); a=d[''anomalies'']; c=sum(1 for x in a if x[''severity'']==''CRITICAL''); print(f''{len(a)} anomalias ({c} CRITICAL)'')"'
  artifacts:
    when: always
    paths:
      - reports/anomalies.json
      # cópia versionada (snapshot que o front importa) também publicada
      - src/src/data/anomalies.json
    expire_in: 30 days
