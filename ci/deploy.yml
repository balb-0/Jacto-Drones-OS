# ─────────────────────────────────────────────────────────────────────────
# Serviços de Deploy (TG1.4/1.5 — @Vitor)
#
# Modelo CD imutável SEM Container Registry (ADR-0006): o artefato imutável é o
# artefato de CI por $CI_COMMIT_SHA (metrics.json). Promoção dev→staging→prod =
# MESMO artefato re-apontado por Environment, sem rebuild (espelha promoção por
# re-tag do demo, ADR-002/004). Deploy SIMULADO: registra a promoção; a operação
# real (k8s/OpenChoreo) fica como trabalho futuro.
#
# "Quem aperta o botão" (Aula 07): staging é automático em develop/main; prod e
# rollback são `when: manual` DENTRO da regra (no nível do job o when é ignorado
# quando há rules:). Deploy roda no stage 'deploy' (após 'gate'): sem `needs:`,
# herda artefatos dos stages anteriores e NÃO contorna os quality gates.
# ─────────────────────────────────────────────────────────────────────────

.deploy_base:
  image: python:3.12-slim
  variables:
    GIT_STRATEGY: fetch

# STAGING — automático em develop/main. SEM needs: respeita a ordem de stages
# (gate roda antes), herdando metrics.json dos stages anteriores por padrão.
deploy_staging:
  extends: .deploy_base
  stage: deploy
  environment:
    name: staging
    url: "https://staging.jacto-drones-os.local/$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  script:
    - python scripts/promote_artifact.py --env staging --sha "$CI_COMMIT_SHA"
  artifacts:
    paths: [reports/deploy-staging.json]
    when: always
    expire_in: 30 days

# PROD — gate humano (when: manual dentro do rule). needs: deploy_staging para
# sequenciar após o staging (mesmo artefato, sem rebuild).
deploy_prod:
  extends: .deploy_base
  stage: deploy
  needs: ["deploy_staging"]
  environment:
    name: prod
    url: "https://prod.jacto-drones-os.local/$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - python scripts/promote_artifact.py --env prod --sha "$CI_COMMIT_SHA"
  artifacts:
    paths: [reports/deploy-prod.json]
    when: always
    expire_in: 30 days

# ROLLBACK de prod — re-aponta prod a um SHA anterior. when: manual no rule.
rollback_prod:
  extends: .deploy_base
  stage: deploy
  environment:
    name: prod
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  variables:
    ROLLBACK_SHA: ""   # informar o SHA de destino ao acionar manualmente
  script:
    - test -n "$ROLLBACK_SHA" || { echo "Defina ROLLBACK_SHA (SHA do artefato alvo)"; exit 1; }
    - python scripts/promote_artifact.py --env prod --sha "$ROLLBACK_SHA" --rollback
  artifacts:
    paths: [reports/deploy-prod.json]   # rastro auditável do rollback
    when: always
    expire_in: 30 days

# RELEASE em tag v* — cria um GitLab Release REAL (keyword release:/release-cli)
# referenciando o artefato imutável por SHA. dependencies herda metrics.json do
# job SITL (mesmo SHA da tag).
release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  dependencies: ["sitl-mission-metrics"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  before_script:
    - apk add --no-cache python3 >/dev/null 2>&1 || true
  script:
    - python3 scripts/promote_artifact.py --env release --sha "$CI_COMMIT_SHA" --tag "$CI_COMMIT_TAG"
    - echo "criando GitLab Release $CI_COMMIT_TAG (SHA $CI_COMMIT_SHA)"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Jacto Drones OS $CI_COMMIT_TAG"
    description: "Artefato imutável por SHA $CI_COMMIT_SHA. KPIs da missão SITL em reports/metrics.json (artefato de CI). Promoção por ambiente sem rebuild (ADR-0006)."
  artifacts:
    paths: ["reports/release-$CI_COMMIT_TAG.json"]
    when: always
    expire_in: never
