# ─────────────────────────────────────────────────────────────────────────
# Serviços de Deploy (TG1.4/1.5 — @Vitor)
#
# Modelo CD imutável SEM Container Registry (ADR-0006): o artefato imutável é o
# artefato de CI por $CI_COMMIT_SHA (metrics.json + binário SITL). Promoção
# dev→staging→prod = MESMO artefato re-apontado por Environment, sem rebuild
# (espelha promoção-por-re-tag do demo, ADR-002/004). Deploy SIMULADO: registra
# a promoção; a operação real (k8s/OpenChoreo) fica como trabalho futuro.
#
# "Quem aperta o botão" (Aula 07): staging é automático em develop/main;
# prod é `when: manual` (Continuous Delivery — apropriado para firmware).
# ─────────────────────────────────────────────────────────────────────────

.deploy_base:
  image: python:3.12-slim
  variables:
    GIT_STRATEGY: fetch

# Promoção para STAGING — automática quando o código chega em develop/main.
deploy_staging:
  extends: .deploy_base
  stage: deploy
  needs:
    - job: sitl-mission-metrics      # consome o artefato metrics.json (se existir)
      optional: true
      artifacts: true
  environment:
    name: staging
    url: "https://staging.jacto-drones-os.local/$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  script:
    - python scripts/promote_artifact.py --env staging --sha "$CI_COMMIT_SHA"
  artifacts:
    paths: [reports/deploy-staging.json]
    when: always
    expire_in: 30 days

# Promoção para PROD — gate humano (when: manual). Mesmo artefato, sem rebuild.
deploy_prod:
  extends: .deploy_base
  stage: deploy
  needs: ["deploy_staging"]
  when: manual
  environment:
    name: prod
    url: "https://prod.jacto-drones-os.local/$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - python scripts/promote_artifact.py --env prod --sha "$CI_COMMIT_SHA"
  artifacts:
    paths: [reports/deploy-prod.json]
    when: always
    expire_in: 30 days

# Rollback de prod — re-aponta prod para um SHA anterior (mesma mecânica inversa).
rollback_prod:
  extends: .deploy_base
  stage: deploy
  when: manual
  environment:
    name: prod
    action: prepare
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    ROLLBACK_SHA: ""   # informar o SHA de destino ao acionar manualmente
  script:
    - test -n "$ROLLBACK_SHA" || { echo "Defina ROLLBACK_SHA (SHA do artefato alvo)"; exit 1; }
    - python scripts/promote_artifact.py --env prod --sha "$ROLLBACK_SHA" --rollback

# Release em tag v* — GitLab Release com checksum/SBOM do artefato (imutável).
release:
  extends: .deploy_base
  stage: deploy
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
  script:
    - python scripts/promote_artifact.py --env release --sha "$CI_COMMIT_SHA" --tag "$CI_COMMIT_TAG"
  artifacts:
    paths: [reports/release-$CI_COMMIT_TAG.json]
    when: always
