# ─────────────────────────────────────────────────────────────────────────
# TG2 — PX4 SITL real + métricas + testes (@Calebe)
#
# Sem Docker daemon e sem registry (ADR-0006): a imagem pública px4-dev é o
# RUNTIME do job. Build PX4 (cache .ccache) → jmavsim headless → mavsdk_server
# → missão square_50m → .ulg → pyulog → metrics.json (KPIs p/ o gate) +
# flight-telemetry.json (série temporal real p/ o Flight Replay) → testes SITL.
# Validado por spike (pipeline 30065): missão 0/5→5/5, metrics realistas.
#
# Guards anti-falso-verde: se px4/mavsdk_server não sobem, ou se a missão não
# gera .ulg, ou se metrics.json sai degenerado, o job FALHA (não passa em
# silêncio). Cleanup garantido em after_script.
# ─────────────────────────────────────────────────────────────────────────

# Testes unitários (funções puras) + coverage.xml para o quality gate (TG6).
unit-tests:
  stage: build
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip"
  cache:
    key: pip-unit
    paths: [.pip/]
  before_script:
    - pip install --quiet pytest pytest-cov pyyaml
  script:
    # Coverage medido sobre a lib de domínio (libs/) — funções puras testáveis.
    # Os CLIs (run_mission, promote_artifact) são exercitados via SITL, não unit.
    - PYTHONPATH=. pytest tests/unit -v --cov=libs --cov-report=xml:coverage.xml --cov-report=term
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    paths: [coverage.xml]
    when: always
    expire_in: 30 days

# Missão SITL real → metrics.json → testes de integração (invariantes + baseline).
#
# parallel:matrix (ADR-0011 — prova de conceito multi-cliente): o MESMO firmware
# (mesmo build PX4/imagem/PX4_TAG) roda a missão de cada "cliente"; cada execução
# extrai um artefato distinto reports/metrics-$CLIENTE.json do seu próprio .ulg
# real. CLIENTE/MISSION andam juntos na matrix porque o arquivo de missão de cada
# cliente tem nome próprio. NÃO é multi-tenancy real — ver docs/decisoes/0011.
# O cliente CANÔNICO (jacto_ref) roda a missão ORIGINAL square_50m, p/ a qual os
# gates/tests-sitl são calibrados, e é dele que sai o metrics.json do gate; os
# demais (cliente_a/_b) são demonstrativos não-canônicos (não alimentam o gate).
sitl-mission-metrics:
  stage: test
  image: px4io/px4-dev-simulation-jammy:2024-05-18
  timeout: 55m
  parallel:
    matrix:
      # Cliente de REFERÊNCIA (canônico): roda a missão ORIGINAL square_50m, para
      # a qual os thresholds de quality_gates/tests-sitl são calibrados (50m/10m/
      # 5m/s; baseline do spike: dur ~79s, std ~0.69m). É ele quem gera o
      # reports/metrics.json (gate) e o flight-telemetry.json canônicos.
      - CLIENTE: jacto_ref
        MISSION: missions/square_50m.yaml
      # Clientes DEMONSTRATIVOS (não-canônicos): mostram a matrix multi-cliente
      # (ADR-0011) com missões próprias; geram só metrics-$CLIENTE.json sufixado,
      # NÃO alimentam o gate (suas missões têm geometria/altitude diferentes).
      - CLIENTE: cliente_a
        MISSION: missions/cliente_a/talhao_grande_60m.yaml
      - CLIENTE: cliente_b
        MISSION: missions/cliente_b/talhao_pequeno_35m.yaml
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.ccache"
    HEADLESS: "1"
    PX4_TAG: "v1.16.2"
    # Cliente de referência: sua execução (missão square_50m) também publica o
    # reports/metrics.json canônico (sem sufixo) e o flight-telemetry.json, para
    # os consumidores existentes (quality-gates, mr-kpis, Flight Replay) seguirem
    # inalterados — preserva o contrato de artefato E a calibração do gate.
    CANONICAL_CLIENTE: jacto_ref
  cache:
    key: px4-sitl-v1162
    paths: [.ccache/]
  script:
    - 'echo "### [1/6] build PX4 $PX4_TAG (ccache)"'
    - 'git clone --depth 1 --branch "$PX4_TAG" https://github.com/PX4/PX4-Autopilot.git px4src'
    - '(cd px4src && git submodule update --init --recursive && make px4_sitl_default)'
    - 'echo "### [2/6] deps python"'
    - 'pip3 install --quiet "mavsdk==2.8.4" pyulog pyyaml pytest'
    - 'echo "### [3/6] sobe PX4 SITL + jmavsim headless"'
    - '(cd px4src && HEADLESS=1 make px4_sitl jmavsim_iris </dev/null >/tmp/px4.log 2>&1 &)'
    - 'for i in $(seq 1 60); do pgrep -x px4 >/dev/null 2>&1 && { echo "px4 vivo"; break; }; sleep 2; done'
    - 'pgrep -x px4 >/dev/null 2>&1 || { echo "ERRO: px4 nao subiu"; tail -50 /tmp/px4.log; exit 1; }'
    - 'echo "### [4/6] sobe mavsdk_server (udp://:14540, gRPC :50051)"'
    - 'SB=$(python3 -c "import mavsdk,os;print(os.path.join(os.path.dirname(mavsdk.__file__),\"bin\",\"mavsdk_server\"))")'
    - '"$SB" -p 50051 "udp://:14540" >/tmp/mavsdk_server.log 2>&1 &'
    - 'for i in $(seq 1 20); do pgrep -x mavsdk_server >/dev/null 2>&1 && { echo "mavsdk_server vivo"; break; }; sleep 1; done'
    - 'pgrep -x mavsdk_server >/dev/null 2>&1 || { echo "ERRO: mavsdk_server nao subiu"; tail -30 /tmp/mavsdk_server.log; exit 1; }'
    - 'echo "### [5/6] missão $CLIENTE ($MISSION) → .ulg → metrics-$CLIENTE.json"'
    - 'PYTHONPATH=. python3 scripts/run_mission.py --mission "$MISSION" --system-address "udp://:14540"'
    - 'ULG=$(find px4src/build/px4_sitl_default/rootfs/log -name "*.ulg" 2>/dev/null | sort | tail -1); echo "ULG=$ULG"'
    - '[ -n "$ULG" ] || { echo "ERRO: nenhum .ulg gerado — missao nao completou"; tail -50 /tmp/px4.log; exit 1; }'
    # O cliente de referência (canônico) extrai, na MESMA leitura do .ulg, os KPIs
    # (metrics.json, p/ o gate) E a série temporal real (flight-telemetry.json, p/
    # o Flight Replay no front). Os demais clientes geram só o metrics sufixado.
    - 'if [ "$CLIENTE" = "$CANONICAL_CLIENTE" ]; then
         PYTHONPATH=. python3 scripts/extract_metrics.py --ulog "$ULG" --output "reports/metrics-$CLIENTE.json" --telemetry-output reports/flight-telemetry.json --mission-name square_50m;
       else
         PYTHONPATH=. python3 scripts/extract_metrics.py --ulog "$ULG" --output "reports/metrics-$CLIENTE.json";
       fi'
    - 'echo "--- metrics-$CLIENTE.json ---"; cat "reports/metrics-$CLIENTE.json"'
    - 'python3 -c "import json,os; m=json.load(open(f\"reports/metrics-{os.environ[''CLIENTE'']}.json\")); assert m[''max_altitude_m'']>0 and m[''n_samples'']>0, ''metrics degenerado: missao nao voou''; print(''metrics valido'')"'
    - 'echo "### [6/6] testes SITL sobre metrics-$CLIENTE.json"'
    # Baseline (test_baseline_thresholds) é calibrado p/ square_50m → só o cliente
    # canônico roda a suíte completa; clientes demonstrativos rodam apenas os
    # invariantes físicos (válidos p/ qualquer voo, sem calibração por missão).
    - 'if [ "$CLIENTE" = "$CANONICAL_CLIENTE" ]; then
         METRICS_JSON="reports/metrics-$CLIENTE.json" PYTHONPATH=. pytest tests/sitl -v;
       else
         METRICS_JSON="reports/metrics-$CLIENTE.json" PYTHONPATH=. pytest tests/sitl/test_physical_invariants.py -v;
       fi'
    # Cliente de referência também publica metrics.json canônico (sem sufixo):
    # quality-gates/mr-kpis seguem lendo reports/metrics.json sem alteração.
    # Além do metrics, expõe a série real ao front pelo mesmo caminho dos dados
    # versionados (src/src/data/*.json importados estaticamente pelo FlightReplay).
    - 'if [ "$CLIENTE" = "$CANONICAL_CLIENTE" ]; then
         cp "reports/metrics-$CLIENTE.json" reports/metrics.json; echo "metrics.json canonico <- $CLIENTE";
         python3 -c "import json; t=json.load(open(''reports/flight-telemetry.json'')); n=t[''metadata''][''total_points'']; assert n>0 and len(t[''points''])==n, ''flight-telemetry degenerado: missao nao gerou serie''; print(f''flight-telemetry.json valido ({n} pontos)'')";
         mkdir -p src/src/data && cp reports/flight-telemetry.json src/src/data/flight-telemetry.json;
       fi'
  after_script:
    # cleanup garantido mesmo se os testes falharem (não fica no script[])
    - 'pkill -x px4 2>/dev/null || true; pkill -x mavsdk_server 2>/dev/null || true; pkill -f jmavsim 2>/dev/null || true'
  artifacts:
    when: always
    paths:
      # um artefato distinto por cliente da matrix (metrics-cliente_a.json, …)
      - reports/metrics-$CLIENTE.json
      # metrics.json canônico (existe só na execução do cliente de referência)
      - reports/metrics.json
      - reports/flight-telemetry.json
      - src/src/data/flight-telemetry.json
    expire_in: 30 days
