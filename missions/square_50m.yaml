# Missão de referência — quadrado de 50 m a 10 m de altitude.
# Home = default PX4 SITL (Zurique/ETH, coincide com a posição inicial do SITL).
# home → WP1 → WP2 → WP3 → WP4 → RTL (home). Usada para extrair métricas
# baseline de trajetória, altitude e energia (ADR-0003).

name: square_50m
description: |
  Decolagem vertical até 10 m, voa em quadrado de 50 m de lado, retorna para home.

takeoff_altitude_m: 10.0
cruise_speed_m_s: 5.0
acceptance_radius_m: 2.0

# Home default do PX4 SITL
home:
  latitude: 47.397742
  longitude: 8.545594

# Waypoints relativos ao home em NED (north_m, east_m, altitude_m)
waypoints:
  - name: takeoff
    type: takeoff
    altitude_m: 10.0

  - name: wp1_north
    type: waypoint
    north_m: 50.0
    east_m: 0.0
    altitude_m: 10.0

  - name: wp2_northeast
    type: waypoint
    north_m: 50.0
    east_m: 50.0
    altitude_m: 10.0

  - name: wp3_east
    type: waypoint
    north_m: 0.0
    east_m: 50.0
    altitude_m: 10.0

  - name: wp4_home_align
    type: waypoint
    north_m: 0.0
    east_m: 0.0
    altitude_m: 10.0

  - name: return_to_launch
    type: rtl

# Limites duros — missão abortada se exceder
limits:
  max_duration_s: 180
  max_altitude_m: 30.0
  geofence_radius_m: 100.0
